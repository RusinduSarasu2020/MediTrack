<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/auth :: auth('Customer Registration', ~{::main})}">
<body>
<main class="auth-inner" style="max-width: 620px;">
    <a th:href="@{/}" class="d-inline-block mb-4" aria-label="MediTrack home"><img th:replace="~{fragments/brand :: full}"></a>

    <div class="title-section mb-2"><h2>Create Account</h2></div>
    <p class="text-muted mb-4">Register to browse medicines, order with prescriptions and track your orders.</p>

    <th:block th:replace="~{fragments/alerts :: alerts}"></th:block>

    <form th:action="@{/register}" th:object="${form}" method="post">
        <th:block th:replace="~{fragments/alerts :: form-errors}"></th:block>
        <div class="mb-3">
            <label for="fullName" class="form-label required">Full Name</label>
            <input type="text" class="form-control" th:field="*{fullName}" th:errorclass="is-invalid" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="username" class="form-label required">Username</label>
                <input type="text" class="form-control" th:field="*{username}" th:errorclass="is-invalid" required autocomplete="username">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label required">Email Address</label>
                <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="text" class="form-control" th:field="*{phone}">
            </div>
            <div class="col-md-6">
                <label for="address" class="form-label">Delivery Address</label>
                <input type="text" class="form-control" th:field="*{address}">
            </div>
        </div>
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label for="password" class="form-label required">Password</label>
                <input type="password" class="form-control" th:field="*{password}" th:errorclass="is-invalid" required autocomplete="new-password">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="col-md-6">
                <label for="confirmPassword" class="form-label required">Confirm Password</label>
                <input type="password" class="form-control" th:field="*{confirmPassword}" th:errorclass="is-invalid" required autocomplete="new-password">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-3">Register Account</button>
    </form>

    <p class="mt-4 text-center">
        Already have an account? <a th:href="@{/login}" class="text-primary fw-semibold">Sign In</a>
    </p>
</main>
</body>
</html>
